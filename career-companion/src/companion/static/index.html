<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Companion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <div class="shell">
    <nav id="side" class="side" aria-label="Sections"></nav>
    <main id="main" class="sheet" tabindex="-1"></main>
    <div id="resize" class="resize" role="separator" aria-orientation="vertical" aria-label="Resize companion panel" tabindex="0"></div>
    <aside id="dock" class="dock" aria-label="Tempo, your companion">
      <header class="dock-head">
        <span id="orb" class="orb is-ready"></span>
        <div class="dock-id">
          <div class="dock-name">Tempo</div>
          <div id="dock-status" class="dock-status" role="status">Ready</div>
        </div>
        <button id="dock-collapse" type="button" class="icon-btn" aria-label="Collapse companion panel"></button>
      </header>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-label="Conversation with Tempo"></div>
      <div id="chat-attach" class="chat-attach"></div>
      <form id="chat-form" class="composer">
        <label class="sr" for="chat-input">Message Tempo</label>
        <textarea id="chat-input" rows="1" maxlength="4000" placeholder="Talk it through…"></textarea>
        <button id="chat-send" type="submit" class="send" aria-label="Send message"></button>
      </form>
    </aside>
  </div>
  <button id="dock-pill" type="button" class="dock-pill"></button>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
